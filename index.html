<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">

<title>0929 沐容美學診所拍攝時程</title>
<style>
/* 固定深色（Lee 2026-09-27 交辦），不跟系統的淺色深色切換 */
:root{
  --bg:#121215;--card:#1d1d22;--ink:#f2f2f4;--ink2:#b5b5bd;--ink3:#84848d;--line:#33333a;
  --red:#ff4d5a;--red-dark:#e0303e;--red-soft:#3a1b1f;
  --now:#ff4d5a;
  --t-build:#3a3a40;--t-build-soft:#232328;
  --t-morning:#5a4a1e;--t-morning-soft:#2a2519;
  --t-stage:#5e2e40;--t-stage-soft:#2c1c24;
  --t-after:#2a4a33;--t-after-soft:#1b2a1f;
  --t-evening:#3e3352;--t-evening-soft:#231f2c;
  --tbc:#4a3a12;--tbc-ink:#ffd27a;
  --f-clock:32px;--f-time:28px;--f-stage:22px;--f-h:19px;--f-body:17px;--f-small:15px;--f-tiny:13px;
  --tap:48px;--r:14px;--r-sm:10px;--pad:16px;--shell:600px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--tap) + 92px)}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:var(--f-body);line-height:1.45;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* 頁首：時鐘與三個視圖，吸頂 */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.top .in{max-width:var(--shell);margin:0 auto;padding:10px var(--pad) 10px}
.row1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:var(--f-small);font-weight:700;color:var(--ink2);letter-spacing:.02em;
  flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{color:var(--red)}
.clock{flex:none;font-size:var(--f-clock);font-weight:800;line-height:1;letter-spacing:.01em}
.tabs{display:flex;gap:6px;margin-top:10px;background:var(--bg);border-radius:12px;padding:4px}
.tabs button{flex:1;min-height:44px;border-radius:9px;font-size:var(--f-body);font-weight:700;color:var(--ink2)}
.tabs button[aria-current=page]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
main{max-width:var(--shell);margin:0 auto;padding:12px var(--pad) 0}
.view{display:none}.view.on{display:block}
.hint{font-size:var(--f-small);color:var(--ink2);margin:2px 0 10px}

/* 現在 */
.nowbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.nowbar .lbl{font-size:var(--f-h);font-weight:800}
.nowbar .lbl.live::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;
  background:var(--now);margin-right:8px;vertical-align:1px}
.nav{display:flex;gap:6px}
.nav button{min-width:var(--tap);min-height:var(--tap);border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--card);font-size:var(--f-body);font-weight:700;padding:0 12px}
.nav button.back{color:var(--red);border-color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.card.cur{border-color:var(--now);box-shadow:0 0 0 2px var(--now) inset}
/* 色帶：左欄時段在上、倒數在下；右欄放計時器圖示，跨兩列置中 */
.band{padding:12px var(--pad);display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px}
.band .t{grid-column:1;font-size:var(--f-time);font-weight:800;line-height:1.1}
.band .left{grid-column:1;font-size:var(--f-small);font-weight:700;color:var(--ink);opacity:.8;margin-top:4px}
/* 活動日之前的倒數卡：數字大、單位小 */
.evt .band{padding:18px var(--pad)}
.evt .band .t{font-size:34px}
.evt .band .t small{font-size:var(--f-h);font-weight:700;margin:0 10px 0 3px}
.evt .band .left{font-size:var(--f-body);margin-top:8px}
/* 圖示跟時段字同高（Lee 2026-09-28）：圓圈 31px＝字級 28px×行高 1.1，對齊第一列；可點範圍用偽元素外擴到 47px */
.tmr{grid-column:2;grid-row:1;align-self:center;position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:31px;height:31px;border-radius:50%;border:1.5px solid var(--ink);color:var(--ink);background:rgba(255,255,255,.08)}
.tmr::before{content:"";position:absolute;inset:-8px;border-radius:50%}
.tmr:active{background:rgba(255,255,255,.2)}
.tmr svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* 頁面內倒數：紅底佔畫面上半，頁首與內容往下讓位 */
.cd{display:none;position:fixed;top:0;left:0;right:0;height:50vh;z-index:60;background:#c8102e;color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) var(--pad) 12px;text-align:center}
body.timing .cd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
body.timing{padding-top:50vh}
body.timing .top{top:50vh}
.cdhead{font-size:var(--f-h);font-weight:800;opacity:.92}
.cdwhat{font-size:var(--f-body);opacity:.92;max-width:var(--shell);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cdnum{font-size:min(84px,20vw);font-weight:800;line-height:1;margin:10px 0 12px;letter-spacing:.02em}
.cdstop{min-height:48px;padding:0 22px;border:2px solid #fff;border-radius:999px;color:#fff;font-weight:800;font-size:var(--f-body)}
.cdstop:active{background:rgba(255,255,255,.2)}
.cd.done{animation:cdpulse .8s step-end infinite}
@keyframes cdpulse{50%{background:#ff3b30}}
.build .band{background:var(--t-build)}.morning .band{background:var(--t-morning)}
.stage .band{background:var(--t-stage)}.after .band{background:var(--t-after)}.evening .band{background:var(--t-evening)}
.stagename{padding:12px var(--pad) 0;font-size:var(--f-stage);font-weight:800;line-height:1.3}
.stagename small{display:block;font-size:var(--f-tiny);font-weight:700;color:var(--ink3);letter-spacing:.06em;margin-bottom:2px}
.kv{padding:10px var(--pad) 0}
.kv .k{font-size:var(--f-tiny);font-weight:700;color:var(--ink3);letter-spacing:.06em;margin-bottom:2px}
.kv .v{font-size:var(--f-body);white-space:pre-line}
.script{margin:12px var(--pad) 0}
.script button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;
  border:1.5px solid var(--red);border-radius:999px;color:var(--red);background:var(--red-soft);font-weight:700;font-size:var(--f-small)}
.script button::after{content:"▾";font-size:12px}
.script button[aria-expanded=true]::after{content:"▴"}
.script .body{display:none;margin-top:10px;font-size:var(--f-body);white-space:pre-line;
  border-left:3px solid var(--red);padding-left:12px;color:var(--ink)}
.script button[aria-expanded=true]+.body{display:block}
.acts{list-style:none;padding:6px 0 4px}
.acts li{display:flex;gap:10px;align-items:flex-start;padding:10px var(--pad);border-top:1px solid var(--line)}
.acts li:first-child{border-top:0}
.acts .u{flex:1;min-width:0}
.acts .un{font-size:var(--f-tiny);font-weight:700;color:var(--ink3);letter-spacing:.04em;margin-bottom:1px}
.acts .ti{font-size:var(--f-body);font-weight:700;white-space:pre-line}
.acts .su{font-size:var(--f-small);color:var(--ink2);white-space:pre-line;margin-top:1px}
.acts .rg{font-size:var(--f-small);color:var(--ink2);margin-top:1px}
.acts .rg b{color:var(--ink);font-weight:700}
.tag{display:inline-block;font-size:var(--f-tiny);font-weight:700;padding:1px 7px;border-radius:6px;
  background:var(--tbc);color:var(--tbc-ink);vertical-align:2px;margin-left:6px}
.call{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;
  border:1.5px solid var(--red);border-radius:999px;color:var(--red);text-decoration:none;
  font-size:var(--f-small);font-weight:700;background:var(--card)}
.call:active{background:var(--red-soft)}
.call svg{width:16px;height:16px;fill:currentColor;flex:none}
.empty{padding:16px var(--pad);color:var(--ink2);font-size:var(--f-body)}
h2{font-size:var(--f-h);font-weight:800;margin:18px 0 8px}
.next .band .t{font-size:var(--f-h)}
.next .band .in{grid-column:1 / -1;margin-top:2px;font-size:var(--f-small);font-weight:700;color:var(--ink);opacity:.8}
.starts{list-style:none;padding:4px 0 6px}
.starts li{padding:6px var(--pad);font-size:var(--f-body);display:flex;gap:8px;align-items:baseline}
.starts .un{flex:none;font-size:var(--f-tiny);font-weight:700;color:var(--ink3);min-width:5.5em}
.starts .st{font-weight:700}
.starts .st .su{font-weight:400;color:var(--ink2);font-size:var(--f-small)}

/* 全日 */
.ctl{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.ctl select{flex:1 1 0;min-width:0;min-height:var(--tap);font:inherit;font-size:var(--f-body);font-weight:700;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 12px;
  -webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.ctl button{flex:none;min-height:var(--tap);padding:0 14px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--card);font-weight:700;font-size:var(--f-small)}
details.slot{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:8px;overflow:hidden}
details.slot.cur{border-color:var(--now);box-shadow:0 0 0 2px var(--now) inset}
details.slot summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:var(--tap);padding:8px var(--pad);cursor:pointer}
details.slot summary::-webkit-details-marker{display:none}
details.slot summary .t{flex:none;font-size:var(--f-body);font-weight:800;min-width:7.2em}
details.slot summary .s{flex:1;min-width:0;font-size:var(--f-small);color:var(--ink2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.slot summary .s.stg{color:var(--ink);font-weight:700}
details.slot summary .now{flex:none;font-size:var(--f-tiny);font-weight:800;color:#fff;background:var(--now);padding:2px 8px;border-radius:6px}
details.slot summary::after{content:"›";flex:none;font-size:22px;color:var(--ink3);transform:rotate(90deg);transition:transform .15s}
details.slot[open] summary::after{transform:rotate(-90deg)}
details.slot.build summary{border-left:6px solid var(--t-build)}
details.slot.morning summary{border-left:6px solid var(--t-morning)}
details.slot.stage summary{border-left:6px solid var(--t-stage)}
details.slot.after summary{border-left:6px solid var(--t-after)}
details.slot.evening summary{border-left:6px solid var(--t-evening)}
.divider{margin:18px 0 8px;font-size:var(--f-small);color:var(--ink2);white-space:pre-line}
.divider a{color:var(--red);font-weight:700}
.uline{list-style:none}
.uline li{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px var(--pad);margin-bottom:8px;display:flex;gap:12px}
.uline li.cur{border-color:var(--now);box-shadow:0 0 0 2px var(--now) inset}
.uline .t{flex:none;font-weight:800;min-width:7.2em;font-size:var(--f-body)}
.uline .ti{font-weight:700;white-space:pre-line}
.uline .su{font-size:var(--f-small);color:var(--ink2);white-space:pre-line}

/* 電話 */
.tel{list-style:none}
.tel li{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px var(--pad);margin-bottom:10px}
.tel .nick{font-size:var(--f-stage);font-weight:800;line-height:1.2}
.tel .note{font-size:var(--f-small);color:var(--ink2);margin-top:3px}
.tel .call{display:flex;justify-content:center;width:100%;margin-top:10px;
  background:var(--red);color:#fff;border-color:var(--red);font-size:var(--f-h);min-height:52px}
.tel .call svg{width:20px;height:20px}
.tel .call:active{background:var(--red-dark)}
.dash{font-weight:400;color:var(--ink3);margin:0 .06em}
footer{max-width:var(--shell);margin:24px auto 0;padding:0 var(--pad);font-size:var(--f-tiny);color:var(--ink3)}
</style>
</head>

  el.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
    const cur = st === 'live' ? (followLive ? live : cursor) : (cursor === null ? 0 : cursor);
    if (b.dataset.go === 'live') { followLive = true; }
    else {
      let base = cur === null ? S.length : (cur < 0 ? -cur - 1 - (b.dataset.go === 'prev' ? 0 : 1) : cur);
      base += b.dataset.go === 'prev' ? -1 : 1;
      cursor = Math.max(0, Math.min(S.length - 1, base)); followLive = false;
    }
    renderNow(); window.scrollTo({top: 0});
  }));
  el.querySelectorAll('.tmr').forEach(b => b.addEventListener('click', () => {
    const s = S[+b.dataset.slot];
    if (timerMinutes(s) <= 0) { renderNow(); return; }          // 畫面上的數字過期了，重畫就好
    startCountdown(s); window.scrollTo({top: 0});
  }));
}
function renderDay() {

  const evStart = S.findIndex(s => s.tone === 'evening');

  let html = `<div class="ctl"><select id="usel" aria-label="看哪個單位">${opts}</select>` + (unitSel ? '' : `<button type="button" id="tog">全部展開</button>`) + `</div>`;

      return `<li class="${cur ? 'cur' : ''}"><div class="t num">${rng(a.from, a.to)}</div><div><div class="ti">${esc(a.title)}${a.tbc ? '<span class="tag">時段待定</span>' : ''}</div>${a.sub ? `<div class="su">${esc(a.sub)}</div>` : ''}</div></li>`;
    }).join('')}</ul>` : `<div class="card"><div class="empty">這個單位今天表上沒有安排。</div></div>`;
  } else {

      return (i === evStart ? noteHtml : '') +
        `<details class="slot ${s.tone} ${cur ? 'cur' : ''}" ${cur ? 'open' : ''} id="s${i}"><summary><span class="t num">${rng(s.start, s.end)}</span>${sum}${cur ? '<span class="now">現在</span>' : ''}</summary>${s.stage ? stageBlock(s.stage) : ''}${acts}</details>`;

function renderTel() {
  $('#tel').innerHTML = `<ul class="tel">${D.contacts.map(c => `<li><div class="who"><div class="nick">${esc(c.nick)}</div>${c.note ? `<div class="note">${esc(c.note)}</div>` : ''}</div><a class="call" href="tel:${c.tel}" aria-label="撥給 ${esc(c.nick)}">${ICON}<span class="num">${esc(c.phone)}</span></a></li>`).join('')}</ul>`;

function show(v, push) {
  view = ['now','day','tel'].includes(v) ? v : 'now';
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === view));
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.v === view ? 'page' : 'false'));
  if (view === 'now') renderNow();
  if (view === 'day') { renderDay(); const c = $('#day details.cur'); if (c && !unitSel) setTimeout(() => c.scrollIntoView({block: 'start'}), 0); }
  if (view === 'tel') renderTel();
  if (push && location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
}
function tick() {
  const d = new Date();
  $('#clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (view === 'now' && tick.last !== nowMin() && (dayState() !== 'live' || followLive)) renderNow();   // 每分鐘重畫：活動日跟著時鐘，其他日子更新倒數
  tick.last = nowMin();
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => show(b.dataset.v, true)));
